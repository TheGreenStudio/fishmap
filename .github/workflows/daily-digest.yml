# Ежедневная сводка в Telegram-группу «Дикая Рыбалка»: погода в Calgary + новости.
# Секреты (Settings -> Secrets and variables -> Actions): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SUPABASE_GROUP_CODE.
# Чтобы переключить с тестового чата на группу, достаточно заменить TELEGRAM_CHAT_ID.
name: daily-digest
on:
  schedule:
    # С ноября 2026 Альберта живёт на постоянном UTC-6 (без перехода на зимнее время): 7:30 по Calgary = 13:30 UTC.
    # Второй запуск в 14:30 UTC (8:30 по Calgary) нужен как повтор на случай сбоя первого.
    # Скрипт сам отправляет только в окне 7:20-12:00 по Calgary и не больше раза в день (дата хранится в кэше).
    # Если правила времени в Альберте снова изменятся, поменяйте константу TZ в news-bot/digest.mjs.
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать сообщение в логе, ничего не отправлять'
        type: boolean
        default: true
      save_state:
        description: 'Запомнить отправленные новости и дату (для настоящей отправки включать не нужно)'
        type: boolean
        default: false
      selftest:
        description: 'Проверить только сохранение и чтение кэша, сообщение не отправляется'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: news-bot
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: news-bot/state.json
          key: digest-state-none
          restore-keys: digest-state-
      - name: Restore selftest cache
        if: inputs.selftest
        uses: actions/cache/restore@v6
        with:
          path: news-bot/selftest.json
          key: digest-selftest-none
          restore-keys: digest-selftest-
      - name: Build and send digest
        id: digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Код группы нужен, чтобы прочитать наши точки из Supabase (блок «Клёв по нашим точкам»).
          SUPABASE_GROUP_CODE: ${{ secrets.SUPABASE_GROUP_CODE }}
          # Ручной запуск всегда обходит проверку времени; плановый её соблюдает.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SAVE_STATE: ${{ (github.event_name == 'schedule' || inputs.save_state) && '1' || '0' }}
          SELFTEST: ${{ github.event_name == 'workflow_dispatch' && inputs.selftest && '1' || '0' }}
        run: node news-bot/digest.mjs
      - name: Save state
        if: always() && steps.digest.outputs.saved == 'true'
        uses: actions/cache/save@v6
        with:
          path: news-bot/state.json
          key: digest-state-${{ github.run_id }}
      - name: Save selftest cache
        if: always() && steps.digest.outputs.selftest == 'true'
        uses: actions/cache/save@v6
        with:
          path: news-bot/selftest.json
          key: digest-selftest-${{ github.run_id }}
