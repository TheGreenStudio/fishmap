# Проверки кода бота-сводки: запускаются при каждом изменении папки news-bot и app.js (сеть не нужна).
# app.js входит, потому что news-bot/fishscore.mjs повторяет формулу клёва приложения: тест appsync падает при расхождении.
name: news-bot-tests
on:
  push:
    paths:
      - 'news-bot/**'
      - 'app.js'
      - '.github/workflows/news-bot-tests.yml'
  pull_request:
    paths:
      - 'news-bot/**'
      - 'app.js'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: news-bot
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
      - run: node --test "news-bot/test/*.test.mjs"
