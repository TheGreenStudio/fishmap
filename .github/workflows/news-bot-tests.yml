# Проверки кода бота-сводки: запускаются при каждом изменении папки news-bot (сеть не нужна).
name: news-bot-tests
on:
  push:
    paths:
      - 'news-bot/**'
      - '.github/workflows/news-bot-tests.yml'
  pull_request:
    paths:
      - 'news-bot/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: news-bot
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
      - run: node --test "news-bot/test/*.test.mjs"
