<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3F1" id="themeColor">
<title>Рыбалка: карта мест</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>

<div id="offlineBar" class="offline-bar" hidden><span data-ic="cloud_off" data-size="20" data-sw="2"></span><span>Нет сети. Показаны сохранённые данные</span></div>

<div id="controls">
  <button id="bList" class="pill" type="button" aria-label="Все сохранённые точки">
    <span data-ic="list" data-size="22"></span><span>Точки</span><span id="count" class="badge">0</span>
  </button>
  <button id="bLayers" class="fab fab-layers" type="button" aria-label="Слои и настройки"><span data-ic="layers"></span></button>
  <button id="bLocate" class="fab fab-locate" type="button" aria-label="Где я"><span data-ic="locate"></span></button>
</div>

<div id="layerMenu" class="menu" hidden></div>
<div id="hint" class="hint"><span data-ic="plus" data-size="18" data-sw="2.2"></span><span>Тапните по карте, чтобы увидеть погоду и сохранить точку</span></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<section id="sheet" class="sheet" aria-label="Точка">
  <div id="grab" class="grab" role="button" tabindex="0" aria-label="Изменить высоту панели"><i></i></div>
  <div id="scroll" class="scroll"><div id="sheetBody"></div></div>
</section>

<section id="listView" class="listview" aria-label="Все точки" aria-hidden="true"></section>

<div id="modal" class="modal" hidden><div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div></div>

<script src="leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
