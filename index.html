<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5e8c">
<title>Рыбалка: карта мест</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<style>
  :root { --blue:#0e5e8c; --blue-d:#0a4467; --bg:#fff; --fg:#14232e; --mut:#5d7080; --line:#dde5ec; --accent:#e8590c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); overflow: hidden; }
  #map { position: fixed; inset: 0; z-index: 0; }
  .topbar { position: fixed; z-index: 500; top: 0; left: 0; right: 0; padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
    display: flex; gap: 8px; align-items: center; background: linear-gradient(var(--blue), var(--blue-d)); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .topbar h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; cursor: pointer; }
  .tb { border: 0; background: rgba(255,255,255,.18); color: #fff; padding: 7px 10px; border-radius: 9px; }
  .tb:active { background: rgba(255,255,255,.35); }
  .tb.on { background: var(--accent); }
  #status { position: fixed; z-index: 500; top: calc(56px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(20,35,46,.92); color: #fff;
    padding: 6px 12px; border-radius: 16px; font-size: 13px; display: none; max-width: 92vw; text-align: center; }
  .pin { font-size: 26px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .pin.sel { transform: scale(1.35); }
  .pin.loc { color:#d6336c; }
  #panel { position: fixed; z-index: 600; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 18px rgba(0,0,0,.25); max-height: 56vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  #panel.collapsed #pbody { display: none; }
  #phead { padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #phead .grip { width: 38px; height: 4px; background: #c5d0d9; border-radius: 2px; position: absolute; left: 50%; top: 5px; transform: translateX(-50%); }
  #ptitle { font-weight: 650; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #psummary { color: var(--mut); white-space: nowrap; }
  #pbody { overflow-y: auto; padding: 10px 14px 14px; }
  .now { display: flex; align-items: center; gap: 12px; }
  .now .big { font-size: 44px; line-height: 1; }
  .now .t { font-size: 32px; font-weight: 700; }
  .now .d { color: var(--mut); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .cell { background: #f2f6f9; border-radius: 10px; padding: 8px 10px; }
  .cell b { display: block; font-size: 12px; color: var(--mut); font-weight: 500; }
  .days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .day { background: #f2f6f9; border-radius: 10px; padding: 8px 4px; text-align: center; font-size: 13px; }
  .day .e { font-size: 24px; }
  .day small { color: var(--mut); display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--blue-d); padding: 8px 12px; border-radius: 10px; text-decoration: none; display: inline-block; }
  .btn.pri { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.danger { color: #c92a2a; }
  .note { color: var(--mut); font-size: 12px; margin-top: 10px; }
  .spotlist { margin-top: 12px; }
  .spotlist .item { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; align-items: center; }
  .spotlist .item span.n { flex: 1; }
  #modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  #modal .card { background: #fff; border-radius: 14px; padding: 16px; width: 100%; max-width: 420px; max-height: 88vh; overflow: auto; }
  #modal h2 { margin: 0 0 10px; font-size: 17px; }
  #modal label { display: block; font-size: 13px; color: var(--mut); margin: 8px 0 3px; }
  #modal input, #modal textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid #c5d0d9; border-radius: 9px; }
  #modal textarea { min-height: 110px; font-family: ui-monospace, monospace; font-size: 12px; }
  .leaflet-control-layers { margin-top: 62px !important; }
  .leaflet-top.leaflet-left .leaflet-control-zoom { margin-top: 62px; }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <h1>🎣 Рыбалка</h1>
  <button class="tb" id="bAdd">＋ Точка</button>
  <button class="tb" id="bLoc" title="Где я">📍</button>
  <button class="tb" id="bMenu">⋯</button>
</div>
<div id="status"></div>

<div id="panel" class="collapsed">
  <div id="phead"><span class="grip"></span><span id="ptitle">Погода</span><span id="psummary"></span></div>
  <div id="pbody"></div>
</div>

<div id="modal"><div class="card" id="mcard"></div></div>

<script src="leaflet.js"></script>
<script>
(function () {
  'use strict';

  // ---------- вспомогательное ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const APP_URL = location.origin + location.pathname;
  const DEFAULT = { center: [51.0447, -114.0719], zoom: 10, spots: [] };

  let toastTimer;
  function toast(msg, ms) {
    const el = $('status');
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(toastTimer);
    if (ms !== 0) toastTimer = setTimeout(() => { el.style.display = 'none'; }, ms || 2800);
  }

  // ---------- карта ----------
  const map = L.map('map', { zoomControl: true, attributionControl: true });
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' });
  const topo = L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap, © OpenStreetMap' });
  osm.addTo(map);
  L.control.layers({ 'Карта': osm, 'Топо': topo }, null, { position: 'topleft' }).addTo(map);
  const markers = L.layerGroup().addTo(map);
  let youMarker = null;

  // ---------- данные ----------
  let shared = [];
  let local = lsGet('fishmap.local', []);
  let selected = null; // {id,name,lat,lon} или null (центр)
  let center = DEFAULT.center;
  let adding = false;

  const allSpots = () => shared.map((s) => Object.assign({ shared: true }, s)).concat(local);

  async function loadShared() {
    try {
      const r = await fetch('spots.json', { cache: 'no-cache' });
      const j = await r.json();
      shared = Array.isArray(j.spots) ? j.spots : [];
      center = j.center || DEFAULT.center;
      return j;
    } catch (e) { return DEFAULT; }
  }

  function renderMarkers() {
    markers.clearLayers();
    allSpots().forEach((s) => {
      const sel = selected && selected.id === s.id;
      const icon = L.divIcon({ className: '', html: '<div class="pin' + (sel ? ' sel' : '') + '">🎣</div>', iconSize: [28, 28], iconAnchor: [14, 26] });
      const m = L.marker([s.lat, s.lon], { icon, title: s.name }).addTo(markers);
      m.on('click', () => selectSpot(s));
    });
  }

  // ---------- погода ----------
  const WMO = (c) => {
    if (c === 0) return ['☀️', 'Ясно'];
    if (c === 1) return ['🌤️', 'Малооблачно'];
    if (c === 2) return ['⛅', 'Переменная облачность'];
    if (c === 3) return ['☁️', 'Пасмурно'];
    if (c === 45 || c === 48) return ['🌫️', 'Туман'];
    if (c >= 51 && c <= 55) return ['🌦️', 'Морось'];
    if (c === 56 || c === 57) return ['🌧️', 'Ледяная морось'];
    if (c >= 61 && c <= 65) return ['🌧️', 'Дождь'];
    if (c === 66 || c === 67) return ['🌧️', 'Ледяной дождь'];
    if (c >= 71 && c <= 75) return ['🌨️', 'Снег'];
    if (c === 77) return ['🌨️', 'Снежные зёрна'];
    if (c >= 80 && c <= 82) return ['🌦️', 'Ливень'];
    if (c === 85 || c === 86) return ['🌨️', 'Снегопад'];
    if (c === 95) return ['⛈️', 'Гроза'];
    if (c === 96 || c === 99) return ['⛈️', 'Гроза с градом'];
    return ['🌡️', ''];
  };
  const dirName = (deg) => ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'][Math.round(deg / 45) % 8];
  const rnd = (x) => Math.round(x);
  const fmtT = (x) => (x > 0 ? '+' : '') + rnd(x) + '°';
  const mmHg = (hpa) => rnd(hpa * 0.75006);

  async function getWeather(lat, lon) {
    const key = 'fishmap.wx.' + lat.toFixed(2) + ',' + lon.toFixed(2);
    const cached = lsGet(key, null);
    if (cached && Date.now() - cached.t < 15 * 60 * 1000) return { data: cached.data, t: cached.t, stale: false };
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,apparent_temperature,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_gusts_10m,wind_direction_10m' +
      '&hourly=pressure_msl&past_hours=6' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max' +
      '&forecast_days=4&timezone=auto&wind_speed_unit=kmh';
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 9000);
      const r = await fetch(url, { signal: ctl.signal });
      clearTimeout(to);
      if (!r.ok) throw new Error('http ' + r.status);
      const data = await r.json();
      lsSet(key, { t: Date.now(), data });
      return { data, t: Date.now(), stale: false };
    } catch (e) {
      if (cached) return { data: cached.data, t: cached.t, stale: true };
      return null;
    }
  }

  function pressureTrend(d) {
    try {
      const idx = d.hourly.time.indexOf(d.current.time.slice(0, 13) + ':00');
      if (idx < 6) return '';
      const diff = d.current.pressure_msl - d.hourly.pressure_msl[idx - 6];
      if (diff > 1.5) return ' ↑ растёт';
      if (diff < -1.5) return ' ↓ падает';
      return ' → стабильно';
    } catch (e) { return ''; }
  }

  const panel = $('panel');
  $('phead').addEventListener('click', () => panel.classList.toggle('collapsed'));

  function actionsHtml(s) {
    if (!s) return '';
    const gm = 'https://www.google.com/maps/search/?api=1&query=' + s.lat + ',' + s.lon;
    const route = 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lon;
    const share = APP_URL + '#p=' + s.lat.toFixed(5) + ',' + s.lon.toFixed(5) + ',' + encodeURIComponent(s.name);
    const tg = 'https://t.me/share/url?url=' + encodeURIComponent(share) + '&text=' + encodeURIComponent('🎣 ' + s.name + '\n' + gm);
    return '<div class="actions">' +
      '<a class="btn pri" href="' + route + '" target="_blank" rel="noopener">🧭 Маршрут</a>' +
      '<a class="btn" href="' + tg + '" target="_blank" rel="noopener">✈️ В Telegram</a>' +
      (s.shared ? '' : '<button class="btn danger" data-del="' + esc(s.id) + '">Удалить</button>') +
      '</div>' + (s.note ? '<div class="note">📝 ' + esc(s.note) + '</div>' : '') +
      (s.shared ? '' : '<div class="note">Точка хранится только на этом телефоне. Чтобы её увидели все, отправьте её в Telegram.</div>');
  }

  function listHtml() {
    const spots = allSpots();
    if (!spots.length) return '<div class="note">Пока нет точек. Нажмите «＋ Точка» и тапните по карте.</div>';
    return '<div class="spotlist"><div class="note">Все точки</div>' + spots.map((s) =>
      '<div class="item" data-go="' + esc(s.id) + '"><span>🎣</span><span class="n">' + esc(s.name) + '</span></div>').join('') + '</div>';
  }

  async function showWeather() {
    const s = selected;
    const lat = s ? s.lat : center[0], lon = s ? s.lon : center[1];
    $('ptitle').textContent = s ? s.name : 'Калгари (центр карты)';
    $('psummary').textContent = '…';
    $('pbody').innerHTML = '<div class="note">Загружаю погоду…</div>' + actionsHtml(s) + listHtml();
    const res = await getWeather(lat, lon);
    if (selected !== s) return; // успели выбрать другую точку
    if (!res) {
      $('psummary').textContent = 'нет данных';
      $('pbody').innerHTML = '<div class="note">Нет интернета и нет сохранённой погоды для этого места. Откройте карту с интернетом один раз.</div>' + actionsHtml(s) + listHtml();
      return;
    }
    const d = res.data, c = d.current, dy = d.daily;
    const [em, txt] = WMO(c.weather_code);
    $('psummary').textContent = em + ' ' + fmtT(c.temperature_2m) + ' · ' + rnd(c.wind_speed_10m) + ' км/ч';
    const days = dy.time.map((t, i) => {
      const dt = new Date(t + 'T12:00:00');
      const name = i === 0 ? 'Сегодня' : dt.toLocaleDateString('ru-RU', { weekday: 'short' });
      return '<div class="day"><b>' + esc(name) + '</b><div class="e">' + WMO(dy.weather_code[i])[0] + '</div>' +
        fmtT(dy.temperature_2m_max[i]) + ' / ' + fmtT(dy.temperature_2m_min[i]) +
        '<small>💧 ' + (dy.precipitation_sum[i] || 0).toFixed(1) + ' мм</small>' +
        '<small>💨 ' + rnd(dy.wind_speed_10m_max[i]) + '–' + rnd(dy.wind_gusts_10m_max[i]) + '</small></div>';
    }).join('');
    const when = new Date(res.t).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    $('pbody').innerHTML =
      '<div class="now"><div class="big">' + em + '</div><div><div class="t">' + fmtT(c.temperature_2m) + '</div><div class="d">' + esc(txt) + ', ощущается ' + fmtT(c.apparent_temperature) + '</div></div></div>' +
      '<div class="grid">' +
        '<div class="cell"><b>Ветер</b>' + esc(dirName(c.wind_direction_10m)) + ', ' + rnd(c.wind_speed_10m) + ' км/ч<br><small>порывы до ' + rnd(c.wind_gusts_10m) + '</small></div>' +
        '<div class="cell"><b>Давление</b>' + mmHg(c.pressure_msl) + ' мм рт. ст.<br><small>' + rnd(c.pressure_msl) + ' гПа' + esc(pressureTrend(d)) + '</small></div>' +
        '<div class="cell"><b>Облачность</b>' + rnd(c.cloud_cover) + '%</div>' +
        '<div class="cell"><b>Координаты</b><small>' + lat.toFixed(4) + ', ' + lon.toFixed(4) + '</small></div>' +
      '</div>' +
      '<div class="days">' + days + '</div>' +
      actionsHtml(s) +
      listHtml() +
      '<div class="note">' + (res.stale ? '⚠️ Нет сети, показаны сохранённые данные от ' + when + '. ' : 'Обновлено в ' + when + '. ') + 'Погода: Open-Meteo.</div>';
  }

  function selectSpot(s, fly) {
    selected = s;
    renderMarkers();
    panel.classList.remove('collapsed');
    if (fly) {
      map.setView([s.lat, s.lon], Math.max(map.getZoom(), 13), { animate: false });
      map.panBy([0, Math.round(window.innerHeight * 0.2)], { animate: false }); // точка выше панели погоды
    }
    showWeather();
  }

  // ---------- модальное окно ----------
  function modal(html) { $('mcard').innerHTML = html; $('modal').style.display = 'flex'; }
  function closeModal() { $('modal').style.display = 'none'; $('mcard').innerHTML = ''; }
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });

  function addDialog(lat, lon, presetName) {
    modal('<h2>Новая точка</h2>' +
      '<div class="note">' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</div>' +
      '<label>Название</label><input id="fName" maxlength="60" value="' + esc(presetName || '') + '" placeholder="Например: Bow River, мост">' +
      '<label>Заметка (необязательно)</label><input id="fNote" maxlength="160" placeholder="Глубина, парковка, на что клюёт">' +
      '<div class="actions"><button class="btn pri" id="fSave">Сохранить</button><button class="btn" id="fCancel">Отмена</button></div>');
    $('fName').focus();
    $('fCancel').onclick = closeModal;
    $('fSave').onclick = () => {
      const name = $('fName').value.trim();
      if (!name) { $('fName').focus(); return; }
      const s = { id: uid(), name, lat, lon, note: $('fNote').value.trim() };
      local.push(s); lsSet('fishmap.local', local);
      closeModal();
      selectSpot(s, true);
    };
  }

  // ---------- кнопки ----------
  $('bAdd').addEventListener('click', () => {
    adding = !adding;
    $('bAdd').classList.toggle('on', adding);
    $('bAdd').textContent = adding ? '✕ Отмена' : '＋ Точка';
    if (adding) toast('Тапните по карте, где нужна точка', 0); else $('status').style.display = 'none';
  });
  map.on('click', (e) => {
    if (!adding) return;
    adding = false; $('bAdd').classList.remove('on'); $('bAdd').textContent = '＋ Точка'; $('status').style.display = 'none';
    addDialog(e.latlng.lat, e.latlng.lng);
  });

  $('bLoc').addEventListener('click', () => {
    if (!navigator.geolocation) { toast('Геолокация недоступна'); return; }
    toast('Ищу вас…', 0);
    navigator.geolocation.getCurrentPosition((p) => {
      const ll = [p.coords.latitude, p.coords.longitude];
      if (youMarker) youMarker.remove();
      youMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="pin loc">●</div>', iconSize: [20, 20], iconAnchor: [10, 10] }) }).addTo(map);
      map.setView(ll, Math.max(map.getZoom(), 13));
      $('status').style.display = 'none';
    }, () => toast('Не удалось определить позицию'), { enableHighAccuracy: true, timeout: 12000 });
  });

  $('bMenu').addEventListener('click', () => {
    modal('<h2>Меню</h2><div class="actions" style="flex-direction:column;align-items:stretch">' +
      '<button class="btn pri" id="mOff">⬇️ Сохранить карту для офлайна</button>' +
      '<button class="btn" id="mExp">📤 Копировать мои точки</button>' +
      '<button class="btn" id="mImp">📥 Вставить точки</button>' +
      '<button class="btn" id="mClose">Закрыть</button></div>' +
      '<div class="note">Офлайн сохраняются плитки карты вокруг всех точек (или вокруг Калгари, если точек нет) для выбранного слоя. Делайте это дома по Wi-Fi.</div>');
    $('mClose').onclick = closeModal;
    $('mOff').onclick = () => { closeModal(); downloadOffline(); };
    $('mExp').onclick = async () => {
      const txt = JSON.stringify(local);
      try { await navigator.clipboard.writeText(txt); toast('Скопировано. Вставьте в чат группы'); closeModal(); }
      catch (e) { modal('<h2>Мои точки</h2><textarea id="tx" readonly>' + esc(txt) + '</textarea><div class="actions"><button class="btn" id="xc">Закрыть</button></div>'); $('xc').onclick = closeModal; $('tx').select(); }
    };
    $('mImp').onclick = () => {
      modal('<h2>Вставить точки</h2><label>Текст, скопированный из «Копировать мои точки»</label><textarea id="tx"></textarea>' +
        '<div class="actions"><button class="btn pri" id="ig">Добавить</button><button class="btn" id="ic">Отмена</button></div>');
      $('ic').onclick = closeModal;
      $('ig').onclick = () => {
        try {
          const arr = JSON.parse($('tx').value);
          let n = 0;
          arr.forEach((s) => {
            if (typeof s.lat === 'number' && typeof s.lon === 'number' && s.name && !allSpots().some((x) => x.id === s.id)) {
              local.push({ id: s.id || uid(), name: String(s.name).slice(0, 60), lat: s.lat, lon: s.lon, note: String(s.note || '').slice(0, 160) }); n++;
            }
          });
          lsSet('fishmap.local', local); renderMarkers(); closeModal(); toast('Добавлено точек: ' + n);
        } catch (e) { toast('Не получилось прочитать текст'); }
      };
    };
  });

  // делегирование кликов в панели
  $('pbody').addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { const s = allSpots().find((x) => x.id === go.dataset.go); if (s) selectSpot(s, true); return; }
    const del = e.target.closest('[data-del]');
    if (del && confirm('Удалить точку?')) {
      local = local.filter((x) => x.id !== del.dataset.del); lsSet('fishmap.local', local);
      selected = null; renderMarkers(); showWeather();
    }
  });

  // ---------- офлайн-плитки ----------
  const tileXY = (lat, lon, z) => {
    const n = Math.pow(2, z), r = lat * Math.PI / 180;
    return [Math.floor((lon + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)];
  };
  async function downloadOffline() {
    if (!('caches' in window)) { toast('Браузер не поддерживает офлайн'); return; }
    const layer = map.hasLayer(topo) ? topo : osm;
    const pts = allSpots().length ? allSpots().map((s) => [s.lat, s.lon]) : [center];
    const plan = [[10, 1], [12, 1], [13, 2], [14, 2], [15, 2]];
    const urls = new Set();
    pts.forEach(([lat, lon]) => plan.forEach(([z, r]) => {
      const [cx, cy] = tileXY(lat, lon, z), max = Math.pow(2, z);
      for (let x = cx - r; x <= cx + r; x++) for (let y = cy - r; y <= cy + r; y++) {
        if (y < 0 || y >= max) continue;
        urls.add(layer.getTileUrl({ x: ((x % max) + max) % max, y, z }));
      }
    }));
    const list = Array.from(urls);
    const cache = await caches.open('fishmap-tiles-v1');
    let done = 0, fail = 0;
    toast('Сохраняю карту: 0 / ' + list.length, 0);
    let i = 0;
    async function worker() {
      while (i < list.length) {
        const u = list[i++];
        try {
          if (!(await cache.match(u))) { const r = await fetch(u, { mode: 'cors' }); if (r.ok) await cache.put(u, r); else fail++; }
        } catch (e) { fail++; }
        done++;
        if (done % 10 === 0 || done === list.length) toast('Сохраняю карту: ' + done + ' / ' + list.length, 0);
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    toast(fail ? 'Готово, не загрузилось плиток: ' + fail : 'Карта сохранена для офлайна ✓', 4000);
  }

  // ---------- точка по ссылке из Telegram ----------
  function checkHash() {
    const m = /^#p=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?),(.*)$/.exec(location.hash);
    if (!m) return;
    const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
    let name = '';
    try { name = decodeURIComponent(m[3]).slice(0, 60); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
    if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return;
    const dup = allSpots().find((s) => Math.abs(s.lat - lat) < 0.0001 && Math.abs(s.lon - lon) < 0.0001);
    map.setView([lat, lon], 13);
    if (dup) { selectSpot(dup); return; }
    addDialog(lat, lon, name);
  }

  // ---------- старт ----------
  (async function init() {
    const cfg = await loadShared();
    map.setView(cfg.center || DEFAULT.center, cfg.zoom || DEFAULT.zoom);
    renderMarkers();
    const spots = allSpots();
    if (spots.length > 1) map.fitBounds(L.latLngBounds(spots.map((s) => [s.lat, s.lon])).pad(0.2));
    showWeather();
    checkHash();
    window.addEventListener('hashchange', checkHash);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  })();
})();
</script>
